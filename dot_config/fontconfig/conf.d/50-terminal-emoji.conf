<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The Nerd Font has no emoji; the colour emoji font is its first fallback. -->
  <alias binding="same">
    <family>NotoSansM Nerd Font</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
