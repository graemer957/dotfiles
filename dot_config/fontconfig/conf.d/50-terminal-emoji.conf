<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Alacritty paints bitmap (CBDT) colour emoji but not COLRv1, and both builds call
       themselves "Noto Color Emoji": the CBDT copy gets a family of its own. -->
  <match target="scan">
    <test name="file" compare="contains"><string>/NotoColorEmoji-CBDT.ttf</string></test>
    <edit name="family" mode="assign"><string>Noto Color Emoji CBDT</string></edit>
    <edit name="fullname" mode="assign"><string>Noto Color Emoji CBDT</string></edit>
  </match>
  <!-- The Nerd Font has no emoji: CBDT colour emoji first, then monochrome for anything it lacks. -->
  <alias binding="same">
    <family>NotoSansM Nerd Font</family>
    <accept>
      <family>Noto Color Emoji CBDT</family>
      <family>Noto Emoji</family>
    </accept>
  </alias>
</fontconfig>
