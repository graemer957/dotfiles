[misc]
# pnpm, yarn: no global stores; Node exists only for per-project Yarn Berry.
# cargo:      replaced by the custom command below.
# gcloud:     distro package (paru/dnf); the step would write into its files.
# chezmoi:    applies unseen; reviewed by hand (`chezmoi update -vn`, apply).
# vim:        Neovim plugins update on their own schedule (`:Lazy sync`).
disable = ["pnpm", "yarn", "cargo", "gcloud", "chezmoi", "vim"]

# The binary is cargo-managed; the Cargo step upgrades it with everything else.
no_self_update = true

# Escalate via the Rust sudo; the `sudo` abbr in fish never reaches topgrade.
sudo_command = "sudo-rs"

[commands]
# Replaces the built-in cargo step, which cannot pass --cooldown or choose the
# installer. The window leaves time for a compromised release to be noticed
# and yanked; the shim builds via cargo-auditable so the audit below can read
# each binary's exact dependency tree.
"Cargo (7d cooldown)" = "cargo install-update --all --cooldown 7d --install-cargo ~/.local/bin/cargo_auditable"

# --deny warnings: a yanked or advisoried dependency fails the step, so it
# shows as FAILED in the summary rather than scrolling past.
"Cargo audit" = "cargo audit bin --deny warnings ~/.cargo/bin/*"
