[ids]
*

[main]
# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Temporarily make the escape key do nothing!
esc = noop

# Tap AltGr, then a letter, to type an emoji. Needs ~/.XCompose
# to include /usr/share/keyd/keyd.compose.
rightalt = oneshot(emoji)

[emoji]
v = 🖖
c = ✅
x = ❌
r = 🦀
