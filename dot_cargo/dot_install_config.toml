# Per-crate overrides for `cargo install-update`. Hand-edited; every entry
# needs all three fields or the updater rejects the file, and the
# `install-update-config` subcommand rewrites it without comments.

# nextest refuses to build without --locked (its locked-tripwire crate),
# pinning the tested Cargo.lock; the audit step still sees that tree.
[cargo-nextest]
default_features = true
features = []
enforce_lock = true
